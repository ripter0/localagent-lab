<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CleanSignal{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/">🌍 CleanSignal</a>
        </div>
        <ul class="nav-links">
            <li><a href="/report">Report Pollution</a></li>
            <li><a href="/dashboard">Dashboard</a></li>
        </ul>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>&copy; 2024 CleanSignal - Citizen Pollution Reporting</p>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
