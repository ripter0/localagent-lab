<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelican on a Bicycle</title>
</head>
<body style="margin: 0; padding: 20px; background-color: #f0f8ff; display: flex; justify-content: center; align-items: center; min-height: 100vh;">
    <svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
        <!-- Background -->
        <rect width="400" height="300" fill="#87CEEB"/>
        
        <!-- Ground -->
        <ellipse cx="200" cy="260" rx="180" ry="20" fill="#228B22"/>
        
        <!-- Bicycle Rear Wheel -->
        <circle cx="140" cy="220" r="35" fill="none" stroke="#333" stroke-width="3"/>
        <circle cx="140" cy="220" r="30" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="2,2"/>
        <line x1="140" y1="220" x2="140" y2="185" stroke="#333" stroke-width="2"/>
        <line x1="140" y1="220" x2="175" y2="220" stroke="#333" stroke-width="2"/>
        <line x1="140" y1="220" x2="105" y2="220" stroke="#333" stroke-width="2"/>
        
        <!-- Bicycle Front Wheel -->
        <circle cx="260" cy="220" r="35" fill="none" stroke="#333" stroke-width="3"/>
        <circle cx="260" cy="220" r="30" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="2,2"/>
        <line x1="260" y1="220" x2="260" y2="185" stroke="#333" stroke-width="2"/>
        <line x1="260" y1="220" x2="295" y2="220" stroke="#333" stroke-width="2"/>
        <line x1="260" y1="220" x2="225" y2="220" stroke="#333" stroke-width="2"/>
        
        <!-- Bicycle Frame -->
        <path d="M 140 220 L 200 180 L 260 220" fill="none" stroke="#FF6B35" stroke-width="4" stroke-linecap="round"/>
        <path d="M 140 220 L 200 180 L 260 220" fill="none" stroke="#E74C3C" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
        <path d="M 200 180 L 260 220" fill="none" stroke="#FF6B35" stroke-width="4" stroke-linecap="round"/>
        
        <!-- Bicycle Seat -->
        <ellipse cx="195" cy="175" rx="15" ry="8" fill="#2C3E50"/>
        
        <!-- Bicycle Handlebars -->
        <path d="M 260 185 L 280 170 L 300 175" fill="none" stroke="#34495E" stroke-width="3" stroke-linecap="round"/>
        
        <!-- Bicycle Pedals -->
        <circle cx="200" cy="180" r="5" fill="#7F8C8D"/>
        <circle cx="260" cy="220" r="5" fill="#7F8C8D"/>
        
        <!-- Pelican Body -->
        <ellipse cx="210" cy="160" rx="40" ry="35" fill="#FFA500"/>
        
        <!-- Pelican Wings -->
        <path d="M 170 160 Q 140 180 150 200 L 190 190" fill="none" stroke="#FFA500" stroke-width="3" stroke-linecap="round"/>
        <path d="M 250 160 Q 280 180 270 200 L 230 190" fill="none" stroke="#FFA500" stroke-width="3" stroke-linecap="round"/>
        
        <!-- Pelican Head -->
        <ellipse cx="240" cy="130" rx="25" ry="28" fill="#FFA500"/>
        
        <!-- Pelican Big Beak -->
        <path d="M 265 130 Q 290 150 270 180 L 245 160 Z" fill="#FFD700" stroke="#E6AC00" stroke-width="1"/>
        <path d="M 265 130 Q 290 150 270 180 L 245 160 Z" fill="none" stroke="#E6AC00" stroke-width="1" opacity="0.3"/>
        
        <!-- Pelican Eye -->
        <circle cx="245" cy="125" r="3" fill="#000"/>
        
        <!-- Pelican Legs -->
        <path d="M 200 195 L 200 215" fill="none" stroke="#FFA500" stroke-width="4" stroke-linecap="round"/>
        <path d="M 220 195 L 220 215" fill="none" stroke="#FFA500" stroke-width="4" stroke-linecap="round"/>
        
        <!-- Pelican Feet -->
        <path d="M 200 215 L 195 225 L 205 225 Z" fill="#FFA500"/>
        <path d="M 220 215 L 215 225 L 225 225 Z" fill="#FFA500"/>
        
        <!-- Pelican Tail -->
        <path d="M 170 160 L 160 180 L 180 175 Z" fill="#FFA500"/>
        
        <!-- Title -->
        <text x="200" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#333">Pelican on a Bicycle</text>
    </svg>
</body>
</html>
